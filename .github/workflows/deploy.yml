name: Attendance System UI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-deploy:

    runs-on: [self-hosted, Windows, X64]

    env:
      DEPLOY_PATH: 'E:\Projects\AttendanceSystemUI'
      IIS_SITE: 'AttendanceSystemUI'
      IIS_APP_POOL: 'AttendanceSystemUIPool'
      API_URL: 'http://localhost:8081'

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Verify Node
      # ==========================================

      - name: Verify Node.js
        shell: powershell
        run: |

          Write-Host "Node version:"
          node --version

          Write-Host "NPM version:"
          npm --version


      # ==========================================
      # 3. Install dependencies
      # ==========================================

      - name: Install dependencies
        shell: powershell
        run: |

          npm ci

          if ($LASTEXITCODE -ne 0) {
              Write-Error "npm ci failed."
              exit $LASTEXITCODE
          }


      # ==========================================
      # 4. Build React
      # ==========================================

      - name: Build React application
        shell: powershell
        run: |

          $env:VITE_API_URL = $env:API_URL

          Write-Host "API URL:"
          Write-Host $env:VITE_API_URL

          npm run build

          if ($LASTEXITCODE -ne 0) {
              Write-Error "React build failed."
              exit $LASTEXITCODE
          }


      # ==========================================
      # 5. Verify dist
      # ==========================================

      - name: Verify build
        shell: powershell
        run: |

          $distPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist"

          Write-Host "Build folder:"
          Write-Host $distPath

          if (!(Test-Path $distPath)) {
              Write-Error "dist folder was not created."
              exit 1
          }

          Write-Host "React build completed successfully."


      # ==========================================
      # 6. Stop IIS App Pool
      # ==========================================

      - name: Stop IIS App Pool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "Stopping IIS App Pool..."

          $pool = Get-WebAppPoolState `
            -Name $env:IIS_APP_POOL

          Write-Host "Current state:"
          Write-Host $pool.Value

          if ($pool.Value -ne "Stopped") {

              Stop-WebAppPool `
                -Name $env:IIS_APP_POOL

              Start-Sleep -Seconds 3
          }

          Write-Host "IIS App Pool stopped."


      # ==========================================
      # 7. Deploy
      # ==========================================

      - name: Deploy React application
        shell: powershell
        run: |

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist"

          $destination = $env:DEPLOY_PATH

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Destination:"
          Write-Host $destination

          if (!(Test-Path $source)) {
              Write-Error "React dist folder does not exist."
              exit 1
          }

          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force
          }

          robocopy `
            $source `
            $destination `
            /E `
            /R:3 `
            /W:5

          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $robocopyExitCode"

          if ($robocopyExitCode -ge 8) {

              Write-Error "React deployment failed."

              exit $robocopyExitCode
          }

          Write-Host "React deployment completed."


      # ==========================================
      # 8. Start IIS App Pool
      # ==========================================

      - name: Start IIS App Pool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "Starting IIS App Pool..."

          Start-WebAppPool `
            -Name $env:IIS_APP_POOL

          Start-Sleep -Seconds 5

          $pool = Get-WebAppPoolState `
            -Name $env:IIS_APP_POOL

          Write-Host "App Pool State:"
          Write-Host $pool.Value

          if ($pool.Value -ne "Started") {

              Write-Error "App Pool failed to start."

              exit 1
          }


      # ==========================================
      # 9. Verify IIS Site
      # ==========================================

      - name: Verify IIS Site
        shell: powershell
        run: |

          Import-Module WebAdministration

          $site = Get-Website `
            -Name $env:IIS_SITE

          Write-Host "IIS Site:"
          Write-Host $site.Name

          Write-Host "IIS Site State:"
          Write-Host $site.State

          if ($site.State -ne "Started") {

              Start-Website `
                -Name $env:IIS_SITE
          }


      # ==========================================
      # 10. Health Check
      # ==========================================

      - name: Frontend Health Check
        shell: powershell
        run: |

          Start-Sleep -Seconds 5

          try {

              $response = Invoke-WebRequest `
                -Uri "http://localhost" `
                -UseBasicParsing `
                -TimeoutSec 30

              Write-Host "HTTP Status:"
              Write-Host $response.StatusCode

              if ($response.StatusCode -ne 200) {

                  Write-Error `
                    "Frontend returned HTTP $($response.StatusCode)."

                  exit 1
              }

              Write-Host "Frontend health check successful."

          }
          catch {

              Write-Error "Frontend health check failed."

              Write-Error $_

              exit 1
          }


      # ==========================================
      # 11. Deployment Completed
      # ==========================================

      - name: Deployment Completed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host " Attendance System UI"
          Write-Host " DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================="
          Write-Host ""

          Write-Host "Frontend: http://localhost"
          Write-Host "Backend:  http://localhost:8081"

          Write-Host ""
